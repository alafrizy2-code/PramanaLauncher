name: Build Pramana Launcher APK

on:
  workflow_dispatch:
  push:
    paths:
      - "PramanaLauncher-project.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          # Do not enable Gradle cache here: the starter ZIP has no Gradle Wrapper yet.

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unpack Android project
        run: |
          unzip -q PramanaLauncher-project.zip -d project
          test -f project/settings.gradle.kts
          test -f project/app/build.gradle.kts
          cat > project/app/src/main/res/layout/activity_main.xml <<'EOF'
<?xml version="1.0" encoding="utf-8"?>
<FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
    android:layout_width="match_parent"
    android:layout_height="match_parent"
    android:background="#0A0E9B">
    <ImageView android:id="@+id/wallpaperView" android:layout_width="match_parent" android:layout_height="match_parent" android:scaleType="centerCrop" />
    <LinearLayout android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical">
        <TextView android:layout_width="match_parent" android:layout_height="40dp" android:text="PRAMANA LAUNCHER" android:textColor="#FFFFFF" android:gravity="center_vertical" android:paddingStart="24dp" android:textStyle="bold" />
        <LinearLayout android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1" android:orientation="horizontal">
            <androidx.recyclerview.widget.RecyclerView android:id="@+id/leftMenu" android:layout_width="280dp" android:layout_height="match_parent" />
            <FrameLayout android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1">
                <LinearLayout android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_gravity="center" android:orientation="vertical" android:gravity="center">
                    <TextView android:id="@+id/clockView" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="14:32" android:textSize="72sp" android:textColor="#FFFFFF" android:textStyle="bold" />
                    <TextView android:id="@+id/dateView" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Minggu, 25 Oktober" android:textSize="18sp" android:textColor="#FFFFFF" android:layout_marginTop="8dp" />
                </LinearLayout>
            </FrameLayout>
        </LinearLayout>
    </LinearLayout>
</FrameLayout>
EOF
    pp/src/main/res/layout/activity_main.xml project/app/src/rue
      - name: Build debug APK
        working-directory: project
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PramanaLauncher-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
